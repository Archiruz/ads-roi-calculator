services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: always
        working_dir: /var/www/html
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_URL=${APP_URL}
            - APP_KEY=${APP_KEY}
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE:-ads_roi}
            - DB_USERNAME=${DB_USERNAME:-postgres}
            - DB_PASSWORD=${DB_PASSWORD}
            - SESSION_DRIVER=database
            - SESSION_SECURE_COOKIE=true
        networks:
            - internal

    web:
        image: nginx:alpine
        restart: always
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - internal
        # Note: No public ports exposed; traffic is routed exclusively through cloudflared

    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE:-ads_roi}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_prod_data:/var/lib/postgresql/data
        networks:
            - internal
        # Note: DB is NOT exposed to public internet

    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: always
        command: tunnel run
        environment:
            - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            - web
        networks:
            - internal

networks:
    internal:
        driver: bridge

volumes:
    postgres_prod_data:
        driver: local
